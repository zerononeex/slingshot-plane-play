<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#9fdcff">
<title>Slingshot Plane</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root {
    --ink: #24324a;
    --sky: #9fdcff;
    --gold: #ffc61a;
    --go: #3ccf5a;
    --go-dark: #24a33f;
    --pink: #ff4fa3;
    --panel: rgba(255, 255, 255, 0.92);
    --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: var(--sky);
    font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .screen, #hud { position: fixed; inset: 0; }
  .screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.2vh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .screen[hidden], #hud[hidden], [hidden] { display: none !important; }
  .panel {
    background: var(--panel); border-radius: 28px; padding: 3vh 24px;
    box-shadow: 0 8px 0 rgba(0, 0, 0, 0.12); width: min(92vw, 460px);
    display: flex; flex-direction: column; align-items: center; gap: 2vh;
  }
  h1 {
    margin: 0; font-size: clamp(40px, 7vh, 72px); line-height: 1; color: #fff;
    text-shadow: 0 4px 0 var(--pink), 0 8px 0 rgba(0, 0, 0, 0.15);
    letter-spacing: 1px;
  }
  h2 { margin: 0; font-size: clamp(30px, 5vh, 52px); line-height: 1.05; }
  .stat-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .stat { background: #fff; border-radius: 18px; padding: 8px 16px; font-size: clamp(18px, 2.6vh, 26px); font-weight: 800; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
  .stat small { display: block; font-size: 0.6em; opacity: 0.6; font-weight: 700; }
  .coin-dot { display: inline-block; width: 0.8em; height: 0.8em; border-radius: 50%; background: var(--gold); border: 3px solid #e59f00; vertical-align: -0.05em; margin-right: 0.25em; }
  button {
    font-family: inherit; font-weight: 900; border: 0; border-radius: 22px; cursor: pointer;
    color: #fff; background: var(--go); box-shadow: 0 7px 0 var(--go-dark);
    font-size: clamp(22px, 3.4vh, 34px); padding: 16px 28px; min-height: 64px; touch-action: manipulation;
  }
  button:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--go-dark); }
  button:disabled { background: #b9c2cc; box-shadow: 0 7px 0 #8f99a3; color: #eef1f4; cursor: default; transform: none; }
  .big { font-size: clamp(36px, 6vh, 60px); padding: 2.2vh 56px; border-radius: 30px; }
  .alt { background: #4fa8ff; box-shadow: 0 7px 0 #2f7fd1; }
  .alt:active { box-shadow: 0 2px 0 #2f7fd1; }
  /* Title: stage picker + quick cards */
  #title { gap: 1.6vh; }
  #title h1 { font-size: clamp(34px, 5.6vh, 60px); }
  .stage-row {
    width: min(96vw, 760px); display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 10px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; touch-action: pan-x;
  }
  .stage-card {
    flex: 0 0 auto; width: 150px; min-height: 0; padding: 10px; border-radius: 18px; scroll-snap-align: center;
    display: flex; flex-direction: column; gap: 3px; align-items: flex-start; text-align: left;
    background: #fff; color: var(--ink); box-shadow: 0 5px 0 #c3ccd4; border: 3px solid #dfe5ea; font-size: 14px; font-weight: 700;
  }
  .stage-card .st-name { font-weight: 900; font-size: 17px; }
  .stage-card .st-plane, .stage-card .st-secrets { opacity: 0.7; font-size: 13px; }
  .stage-card .st-lock { font-size: 12px; opacity: 0.8; line-height: 1.2; }
  .stage-card.selected { border-color: var(--go); background: #e6f9ea; box-shadow: 0 5px 0 var(--go-dark); }
  .stage-card.locked, .stage-card:disabled { background: #eef1f4; color: #7b8794; box-shadow: 0 5px 0 #c3ccd4; cursor: default; transform: none; }
  .quick-cards { width: min(96vw, 620px); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .updraft { color: #ffe14d; margin-left: 6px; }
  .unlock { background: #3ccf5a; color: #fff; border-radius: 16px; padding: 6px 14px; font-weight: 900; font-size: clamp(18px, 2.6vh, 26px); }

  /* Title + shop */
  .shop-btn { background: #ff8a3d; box-shadow: 0 7px 0 #d9661b; }
  .shop-btn:active { box-shadow: 0 2px 0 #d9661b; }
  #shop { justify-content: flex-start; gap: 1vh; padding-top: max(12px, env(safe-area-inset-top)); }
  .shop-top { width: min(96vw, 760px); display: flex; justify-content: space-between; align-items: center; }
  .back-btn { min-height: 0; padding: 10px 18px; font-size: clamp(18px, 2.4vh, 24px); }
  .wallet { font-size: clamp(24px, 3.6vh, 36px); }
  .shop-stage { flex: 0 0 24vh; }  /* the 3D plane shows through here */
  .shop-panel {
    flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
    width: min(96vw, 760px); background: var(--panel); border-radius: 26px; padding: 12px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 10px;
  }
  .shop-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (min-aspect-ratio: 1/1) { .shop-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .shop-stage { flex-basis: 30vh; } }
  .parts-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
  .shop-section { font-weight: 900; font-size: clamp(15px, 2vh, 20px); letter-spacing: 1px; text-align: left; padding-left: 4px; }
  .card {
    display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto auto; column-gap: 10px; row-gap: 2px;
    align-items: center; text-align: left; padding: 10px; border-radius: 18px; min-height: 0;
    background: #fff; color: var(--ink); box-shadow: 0 5px 0 #c3ccd4; border: 3px solid #dfe5ea;
    font-size: clamp(13px, 1.7vh, 17px); font-weight: 700;
  }
  .card:active { transform: translateY(3px); box-shadow: 0 2px 0 #c3ccd4; }
  .card .icon { grid-row: 1 / span 3; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; font-size: 26px; background: #f1f4f7; }
  .card .name { font-weight: 900; font-size: 1.1em; }
  .card .effect { opacity: 0.7; font-size: 0.85em; line-height: 1.15; }
  .card .price { font-weight: 900; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .card .pips { display: inline-flex; gap: 3px; }
  .card .pip { width: 11px; height: 11px; border-width: 2px; }
  .pips { display: flex; gap: 6px; }
  .pip { width: 18px; height: 18px; border-radius: 50%; background: #dfe5ea; border: 3px solid #c3ccd4; }
  .pip.on { background: #ff8a3d; border-color: #d9661b; }
  .card.buyable { border-color: #ffc61a; animation: glow 1.2s ease-in-out infinite; }
  .card.maxed { background: #e6f9ea; border-color: var(--go); box-shadow: 0 5px 0 var(--go-dark); }
  .card.locked { opacity: 0.55; filter: grayscale(1); }
  .card:disabled { cursor: default; transform: none; color: var(--ink); background: #fff; box-shadow: 0 5px 0 #c3ccd4; }
  .card.maxed:disabled { background: #e6f9ea; box-shadow: 0 5px 0 var(--go-dark); }
  @keyframes glow { 50% { box-shadow: 0 5px 0 #e59f00, 0 0 18px 4px rgba(255, 198, 26, 0.85); } }
  .paints { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; padding-bottom: 4px; }
  .swatch {
    min-height: 0; width: 92px; padding: 8px 4px; border-radius: 16px; background: #fff; color: var(--ink);
    box-shadow: 0 5px 0 #c3ccd4; border: 3px solid #dfe5ea; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .swatch .dot { width: 34px; height: 34px; border-radius: 50%; border: 3px solid rgba(0,0,0,0.15); }
  .swatch.current { border-color: var(--go); background: #e6f9ea; }
  .swatch:disabled { opacity: 0.5; cursor: default; transform: none; color: var(--ink); background: #fff; box-shadow: 0 5px 0 #c3ccd4; }
  .rainbow-dot { background: conic-gradient(red, orange, yellow, lime, cyan, blue, violet, red); }

  /* Launch speedometer */
  .speedo { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); width: min(64vw, 340px); }
  .speedo svg { width: 100%; display: block; overflow: visible; }
  .speedo-rim { fill: rgba(255,255,255,0.88); stroke: var(--band, #d9b77a); stroke-width: 7; }
  .speedo.full .speedo-rim { animation: rim 0.35s ease-in-out infinite; }
  @keyframes rim { 50% { stroke-width: 12; stroke: #ffffff; } }
  #speedo-zones path { fill: none; stroke-width: 14; }
  #speedo-ticks line { stroke: var(--ink); stroke-width: 3; }
  #speedo-needle line { stroke: var(--band, #e0342f); stroke-width: 7; stroke-linecap: round; }
  #speedo-needle circle { fill: var(--ink); }
  .speedo.full #speedo-shake { animation: tremble 0.08s linear infinite; }
  @keyframes tremble { 50% { transform: rotate(1.6deg); } }
  #speedo-needle, #speedo-shake { transform-origin: 100px 100px; }
  .speedo-read { position: absolute; left: 0; right: 0; top: 64%; text-align: center; font-weight: 900; font-size: clamp(26px, 4.4vh, 44px); line-height: 1; }
  .speedo-read small { display: block; font-size: 0.4em; opacity: 0.6; }

  /* Flight buttons + banners */
  .boost-btn, .eject-btn { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; padding: 0; min-height: 0; }
  .boost-btn { right: max(16px, env(safe-area-inset-right)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 60px); width: 116px; height: 116px; background: #ff8a3d; box-shadow: 0 7px 0 #d9661b; font-size: 22px; }
  .boost-btn svg { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); transform: rotate(-90deg); }
  .boost-btn span { position: relative; }
  .fuel-bg { fill: none; stroke: rgba(255,255,255,0.4); stroke-width: 8; }
  .fuel-ring { fill: none; stroke: #ffe14d; stroke-width: 8; stroke-dasharray: 276.5; stroke-dashoffset: 0; stroke-linecap: round; }
  .boost-btn.on { background: #ff5d2d; transform: scale(0.95); }
  .boost-btn.empty { background: #b9c2cc; box-shadow: 0 7px 0 #8f99a3; }
  .eject-btn { left: max(16px, env(safe-area-inset-left)); bottom: calc(max(18px, env(safe-area-inset-bottom)) + 70px); width: 96px; height: 96px; background: #e8262c; box-shadow: 0 7px 0 #a8161b; font-size: 20px; border: 5px solid #ffd400; }
  .banner {
    position: absolute; left: 50%; top: 15vh; transform: translateX(-50%); white-space: nowrap;
    background: var(--gold); color: var(--ink); font-weight: 900; font-size: clamp(22px, 4vh, 40px);
    padding: 10px 22px; border-radius: 20px; box-shadow: 0 6px 0 #e59f00; animation: pop 0.35s ease-out;
  }
  @keyframes pop { 0% { transform: translateX(-50%) scale(0.4); } 80% { transform: translateX(-50%) scale(1.1); } 100% { transform: translateX(-50%) scale(1); } }
  .verdict { margin: 0; font-weight: 900; font-size: clamp(20px, 3vh, 30px); color: #e59f00; }

  /* HUD */
  #hud { pointer-events: none; }
  .hud-top {
    position: absolute; left: 0; right: 0; top: max(12px, env(safe-area-inset-top));
    display: flex; justify-content: space-between; align-items: flex-start; padding: 0 14px;
  }
  .chip { background: var(--panel); border-radius: 20px; padding: 8px 16px; font-weight: 900; font-size: clamp(22px, 3.6vh, 36px); box-shadow: 0 4px 0 rgba(0,0,0,0.12); }
  #hud-dist { position: absolute; left: 50%; transform: translateX(-50%); font-size: clamp(30px, 5vh, 52px); }
  #btn-pause { pointer-events: auto; min-height: 0; width: 60px; height: 60px; padding: 0; font-size: 26px; border-radius: 18px; background: var(--panel); color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,0.15); }
  .speed { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(18px, env(safe-area-inset-bottom)); width: min(70vw, 420px); }
  .speed-label { font-weight: 900; font-size: 18px; text-align: center; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.25); }
  .bar { height: 26px; border-radius: 14px; background: rgba(255,255,255,0.75); overflow: hidden; border: 4px solid #fff; }
  #speed-fill { height: 100%; width: 0; background: linear-gradient(90deg, #3ccf5a, #ffc61a); border-radius: 10px; transition: width 0.1s linear; }
  #speed-fill.slow { background: #ff6b6b; }
  #speed-fill.momentum { background: linear-gradient(90deg, #ffd23f, #ffb000); box-shadow: 0 0 14px 4px rgba(255, 198, 26, 0.9); }
  .bar:has(#speed-fill.momentum) { border-color: #ffd23f; box-shadow: 0 0 16px rgba(255, 198, 26, 0.9); }
  #aim { position: absolute; inset: 0; }
  .aim-hint { position: absolute; left: 0; right: 0; top: 18vh; text-align: center; }
  .aim-hint .chip { display: inline-block; font-size: clamp(22px, 3.4vh, 34px); }
  .arrow { font-size: 48px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,0.2); animation: nudge 1s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(14px); } }
  #stick { position: fixed; width: 0; height: 0; pointer-events: none; }
  #stick::before { content: ""; position: absolute; width: 150px; height: 150px; left: -75px; top: -75px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.6); }
  #stick-knob { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.75); transform: translate(-50%, -50%); }
  #pause { background: rgba(36, 50, 74, 0.35); }
  .newbest { background: var(--pink); color: #fff; border-radius: 16px; padding: 6px 16px; font-weight: 900; font-size: clamp(20px, 3vh, 30px); transform: rotate(-4deg); }
  .msg { font-size: clamp(18px, 2.6vh, 26px); font-weight: 800; margin: 0; }
  .btn-row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
  @media (orientation: landscape) and (max-height: 520px) {
    .screen { gap: 1.4vh; }
    .panel { padding: 2vh 20px; gap: 1.4vh; }
    h1 { font-size: 11vh; }
    .big { font-size: 8vh; padding: 1.6vh 40px; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<section id="title" class="screen">
  <h1>Slingshot Plane</h1>
  <div class="stage-row" id="stage-row"></div>
  <div class="stat-row">
    <div class="stat"><small>COINS</small><span class="coin-dot"></span><span id="title-coins">0</span></div>
    <div class="stat"><small>BEST</small><span id="title-best">0</span> m</div>
    <div class="stat"><small>SECRETS</small><span id="title-secrets">0/3</span></div>
  </div>
  <div class="quick-cards" id="quick-cards"></div>
  <button id="btn-fly" class="big">FLY!</button>
  <button id="btn-shop" class="shop-btn">🛠 SHOP</button>
</section>

<section id="shop" class="screen" hidden>
  <div class="shop-top">
    <button id="btn-shop-back" class="alt back-btn">◀ BACK</button>
    <div class="chip wallet"><span class="coin-dot"></span><span id="shop-coins">0</span></div>
  </div>
  <div class="shop-stage"></div>
  <div class="shop-panel">
    <div class="shop-grid" id="shop-grid"></div>
    <div class="shop-section">BUILD YOUR PLANE</div>
    <div class="shop-grid parts-grid" id="parts-grid"></div>
    <div class="shop-section">PAINT JOBS</div>
    <div class="paints" id="paints"></div>
  </div>
</section>

<div id="hud" hidden>
  <div class="hud-top">
    <div class="chip"><span class="coin-dot"></span><span id="hud-coins">0</span></div>
    <div class="chip" id="hud-dist">0 m</div>
    <button id="btn-pause" aria-label="Pause">❚❚</button>
  </div>
  <div id="banner" class="banner" hidden></div>
  <div id="aim">
    <div class="aim-hint">
      <div class="arrow">▼</div>
      <div class="chip">Pull back, then let go!</div>
    </div>
    <div class="speedo" id="speedo">
      <svg viewBox="0 0 200 150" aria-hidden="true">
        <circle class="speedo-rim" id="speedo-rim" cx="100" cy="100" r="92"></circle>
        <g id="speedo-zones"></g>
        <g id="speedo-ticks"></g>
        <g id="speedo-needle"><g id="speedo-shake"><line x1="100" y1="100" x2="100" y2="22"></line><circle cx="100" cy="100" r="9"></circle></g></g>
      </svg>
      <div class="speedo-read"><span id="speedo-kmh">0</span><small>km/h</small></div>
    </div>
  </div>
  <div id="hud-flight" hidden>
    <div class="speed">
      <div class="speed-label">SPEED <span id="hud-updraft" class="updraft" hidden>▲ UPDRAFT</span></div>
      <div class="bar"><div id="speed-fill"></div></div>
    </div>
    <button id="btn-eject" class="eject-btn" hidden>EJECT</button>
    <button id="btn-boost" class="boost-btn" hidden>
      <svg viewBox="0 0 100 100" aria-hidden="true"><circle class="fuel-bg" cx="50" cy="50" r="44"></circle><circle class="fuel-ring" id="fuel-ring" cx="50" cy="50" r="44"></circle></svg>
      <span>BOOST</span>
    </button>
  </div>
</div>
<div id="stick" hidden><div id="stick-knob"></div></div>

<section id="pause" class="screen" hidden>
  <div class="panel">
    <h2>Paused</h2>
    <button id="btn-resume" class="big">PLAY</button>
    <button id="btn-pause-home" class="alt">HOME</button>
  </div>
</section>

<section id="results" class="screen" hidden>
  <div class="panel">
    <div class="newbest" id="res-newbest" hidden>NEW BEST!</div>
    <h2>You flew <span id="res-dist">0</span> m!</h2>
    <div class="unlock" id="res-unlock" hidden></div>
    <p class="verdict" id="res-verdict"></p>
    <p class="msg" id="res-msg"></p>
    <div class="stat-row">
      <div class="stat"><small>COINS</small><span class="coin-dot"></span><span id="res-coins">0</span></div>
      <div class="stat"><small>DISTANCE BONUS</small>+<span id="res-bonus">0</span></div>
      <div class="stat" id="res-landing-box"><small>LANDING BONUS</small>+<span id="res-landing">0</span></div>
      <div class="stat"><small>EARNED</small><span class="coin-dot"></span><span id="res-total">0</span></div>
    </div>
    <div class="stat-row">
      <div class="stat"><small>TOP SPEED</small><span id="res-top">0</span> km/h</div>
      <div class="stat" id="res-glide-box" hidden><small>EJECT GLIDE</small><span id="res-glide">0</span> m</div>
      <div class="stat"><small>BEST</small><span id="res-best">0</span> m</div>
    </div>
    <div class="btn-row">
      <button id="btn-again" class="big">FLY AGAIN</button>
      <button id="btn-home" class="alt">HOME</button>
    </div>
  </div>
</section>

<script type="module" src="./js/main.js"></script>
</body>
</html>
